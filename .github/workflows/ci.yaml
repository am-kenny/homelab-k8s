name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # renovate: datasource=github-releases depName=helm/helm
  HELM_VERSION: v4.3.1
  # renovate: datasource=github-releases depName=helmfile/helmfile
  HELMFILE_VERSION: v1.8.2
  # renovate: datasource=github-releases depName=k3s-io/k3s extractVersion=^v(?<version>\d+\.\d+\.\d+)\+k3s\d+$
  KUBERNETES_VERSION: 1.36.3

jobs:
  yamllint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install yamllint
        run: pip install yamllint

      - name: Lint YAML files
        run: yamllint --strict .

  ansible-lint:
    name: Ansible Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Run ansible-lint
        uses: ansible/ansible-lint@v26.10.1
        with:
          requirements_file: "ansible/requirements.yaml"

  helmfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Lint releases
        uses: helmfile/helmfile-action@v2.4.8
        with:
          helm-version: ${{ env.HELM_VERSION }}
          helmfile-version: ${{ env.HELMFILE_VERSION }}
          helmfile-workdirectory: kubernetes
          helmfile-args: lint

      - name: Render releases
        uses: helmfile/helmfile-action@v2.4.8
        with:
          helm-version: ${{ env.HELM_VERSION }}
          helmfile-version: ${{ env.HELMFILE_VERSION }}
          helmfile-workdirectory: kubernetes
          helmfile-args: >-
            template --include-crds --skip-tests --output-dir ${{ github.workspace }}/rendered

      - name: Validate rendered manifests
        uses: docker://ghcr.io/yannh/kubeconform:v0.8.0
        with:
          entrypoint: '/kubeconform'
          args: >-
            -strict
            -summary
            -ignore-missing-schemas
            -kubernetes-version ${{ env.KUBERNETES_VERSION }}
            -schema-location default
            -schema-location https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json
            rendered
