name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # renovate: datasource=github-releases depName=helm/helm
  HELM_VERSION: v4.3.1
  # renovate: datasource=github-releases depName=helmfile/helmfile
  HELMFILE_VERSION: v1.8.3
  # renovate: datasource=github-releases depName=k3s-io/k3s extractVersion=^v(?<version>\d+\.\d+\.\d+)\+k3s\d+$
  KUBERNETES_VERSION: 1.36.3
  # renovate: datasource=github-releases depName=hashicorp/terraform extractVersion=^v(?<version>.+)$
  TERRAFORM_VERSION: 1.17.1

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-latest

    permissions:
      pull-requests: read

    outputs:
      ansible: ${{ github.event_name != 'pull_request' || steps.filter.outputs.ansible == 'true' }}

    steps:
      - name: Filter paths
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v4
        with:
          filters: |
            ansible:
              - 'ansible/**'
              - .ansible-lint

  yamllint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install yamllint
        run: pip install yamllint

      - name: Lint YAML files
        run: yamllint --strict .

  ansible-lint:
    name: Ansible Lint
    needs: changes
    if: needs.changes.outputs.ansible == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Run ansible-lint
        uses: ansible/ansible-lint@v26.11.0
        with:
          requirements_file: "ansible/requirements.yaml"

  helmfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Lint releases
        uses: helmfile/helmfile-action@v2.4.8
        with:
          helm-version: ${{ env.HELM_VERSION }}
          helmfile-version: ${{ env.HELMFILE_VERSION }}
          helmfile-workdirectory: kubernetes
          helmfile-args: lint

      - name: Render releases
        uses: helmfile/helmfile-action@v2.4.8
        with:
          helm-version: ${{ env.HELM_VERSION }}
          helmfile-version: ${{ env.HELMFILE_VERSION }}
          helmfile-workdirectory: kubernetes
          helmfile-args: >-
            template --include-crds --skip-tests --output-dir ${{ github.workspace }}/rendered

      - name: Validate rendered manifests
        uses: docker://ghcr.io/yannh/kubeconform:v0.8.0
        with:
          entrypoint: '/kubeconform'
          args: >-
            -strict
            -summary
            -ignore-missing-schemas
            -kubernetes-version ${{ env.KUBERNETES_VERSION }}
            -schema-location default
            -schema-location https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json
            rendered

  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v7

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Check formatting
        run: terraform fmt -check -recursive -diff

      - name: Validate
        run: |
          for module in */; do
            terraform -chdir="$module" init -backend=false -lockfile=readonly -input=false
            terraform -chdir="$module" validate
          done
