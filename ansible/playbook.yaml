---
# k8s_master is a CentOS stream 9 node
- name: Bootstrap k3s master node
  hosts: k8s_master
  become: true

  tasks:
    - name: Update all packages
      ansible.builtin.dnf:
        name: "*"
        state: latest
        update_cache: true
      register: dnf_update

    # dnf-utils help detect if a reboot is actually required
    # This setup prevents reboot on each package update
    - name: Install dnf-utils
      ansible.builtin.dnf:
        name: dnf-utils
        state: present

    - name: Check if a reboot is required
      ansible.builtin.command: needs-restarting -r
      register: reboot_check
      failed_when: false
      changed_when: false

    - name: Reboot if required
      ansible.builtin.reboot:
        reboot_timeout: 300
      when: reboot_check.rc == 1

    - name: Remove swap entries from fstab
      ansible.builtin.lineinfile:
        path: /etc/fstab
        regexp: "swap"
        state: absent
      register: swap_disable

    - name: Disable swap
      ansible.builtin.command: swapoff -a
      when: swap_disable.changed


- name: Configure firewalld
  hosts: k8s_master
  become: true

  tasks:
    - name: Ensure firewalld is installed
      ansible.builtin.package:
        name: firewalld
        state: present

    - name: Ensure firewalld is running and enabled
      ansible.builtin.service:
        name: firewalld
        state: started
        enabled: true

    - name: Open k3s API server port (6443/tcp)
      ansible.posix.firewalld:
        port: 6443/tcp
        permanent: true
        immediate: true
        state: enabled

    - name: Open Flannel VXLAN port (8472/udp)
      ansible.posix.firewalld:
        port: 8472/udp
        permanent: true
        immediate: true
        state: enabled

    - name: Open kubelet metrics port (10250/tcp)
      ansible.posix.firewalld:
        port: 10250/tcp
        permanent: true
        immediate: true
        state: enabled


- name: Set up k3s
  hosts: k8s_master
  become: true

  tasks:
    - name: Install container-selinux
      ansible.builtin.dnf:
        name: container-selinux
        state: latest

    - name: Install selinux-policy-base
      ansible.builtin.dnf:
        name: selinux-policy-base
        state: latest

    - name: Import Rancher GPG key
      ansible.builtin.rpm_key:
        key: https://rpm.rancher.io/public.key
        state: present

    - name: Add k3s-selinux repo
      ansible.builtin.yum_repository:
        name: rancher-k3s-common-stable
        description: Rancher k3s common (stable)
        baseurl: https://rpm.rancher.io/k3s/stable/common/centos/9/noarch
        gpgcheck: true
        gpgkey: https://rpm.rancher.io/public.key

    # Required for k3s to work with selinux enabled
    - name: Install k3s-selinux
      ansible.builtin.dnf:
        name: k3s-selinux
        state: latest

    - name: Check if k3s is already installed
      ansible.builtin.stat:
        path: /usr/local/bin/k3s
      register: k3s_binary

    - name: Download and install k3s server
      ansible.builtin.shell: curl -sfL https://get.k3s.io | sh -
      when: not k3s_binary.stat.exists

    - name: Ensure k3s is enabled and running
      ansible.builtin.systemd_service:
        name: k3s
        enabled: true
        state: started

    - name: Confirm node is ready
      ansible.builtin.command: /usr/local/bin/k3s kubectl get nodes
      register: node_status
      changed_when: false
 
    - name: Print node status
      ansible.builtin.debug:
        var: node_status.stdout_lines

- name: Set up bonded network with Wi-Fi failover
  hosts: wifi
  become: true

  tasks:
    - name: Validate variables
      ansible.builtin.assert:
        that:
          - eth_interface is defined
          - wifi_interface is defined
          - wifi_ssid is defined
          - wifi_psk is defined
          - bond_address is defined
          - bond_prefix is defined
          - default_gateway is defined
          - wifi_psk | length >= 8 and wifi_psk | length <= 63
        quiet: true

    # Lockout guard: reboot expects to reconnect at the same address
    - name: Refuse to run if the host does not already hold the bond IP
      ansible.builtin.assert:
        that:
          - bond_address in ansible_facts.all_ipv4_addresses
        fail_msg: >-
          {{ inventory_hostname }} has {{ ansible_facts.all_ipv4_addresses | join(', ') }}
          but bond_address is {{ bond_address }}. Set a DHCP reservation for the
          {{ eth_interface }} MAC at {{ bond_address }} and reboot before running this.

    - name: Install wireless networking packages
      ansible.builtin.apt:
        name:
          - wpasupplicant
          - rfkill
        state: present
        update_cache: true
        cache_valid_time: 3600

    # Only firmware triggers a reboot
    - name: Install wireless firmware
      ansible.builtin.apt:
        name: "{{ wifi_firmware_package }}"
        state: present
      when: wifi_firmware_package is defined
      notify: Reboot node

    # Must reboot before the next interface check. Does nothing if firmware was present
    - name: Reboot now if firmware was just installed
      ansible.builtin.meta: flush_handlers

    # Block may brake association
    - name: Unblock wireless
      ansible.builtin.command: rfkill unblock wifi
      changed_when: false

    - name: Re-read interface facts after firmware install
      ansible.builtin.setup:
        gather_subset: network

    - name: Validate interfaces exist
      ansible.builtin.assert:
        that:
          - eth_interface in ansible_facts.interfaces
          - wifi_interface in ansible_facts.interfaces
        fail_msg: "{{ wifi_interface }} not present, firmware may not have loaded"


    # If association fails, check journalctl -u wpa_supplicant@{{ wifi_interface }}
    - name: Configure wpa_supplicant for the WiFi slave
      ansible.builtin.template:
        src: network/wpa_supplicant.conf.j2
        dest: "/etc/wpa_supplicant/wpa_supplicant-{{ wifi_interface }}.conf"
        owner: root
        group: root
        mode: '0600'
      no_log: true
      notify:
        - Reboot node

    # Mask generic wpa_supplicant to avoid conflicts
    - name: Mask generic wpa_supplicant service
      ansible.builtin.systemd_service:
        name: wpa_supplicant.service
        masked: true
        state: stopped

    - name: Enable per-interface wpa_supplicant
      ansible.builtin.systemd_service:
        name: "wpa_supplicant@{{ wifi_interface }}.service"
        masked: false
        enabled: true

    - name: Create bond
      ansible.builtin.template:
        src: network/bond.netdev.j2
        dest: "/etc/systemd/network/10-bond0.netdev"
        owner: root
        group: root
        mode: '0644'
      notify:
        - Reboot node

    - name: Configure bond addressing
      ansible.builtin.template:
        src: network/bond.network.j2
        dest: "/etc/systemd/network/10-bond0.network"
        owner: root
        group: root
        mode: '0644'
      notify:
        - Reboot node

    - name: Configure bond members
      ansible.builtin.template:
        src: network/bond_member.network.j2
        dest: "/etc/systemd/network/10-{{ item.name }}.network"
        owner: root
        group: root
        mode: '0644'
      loop:
        - { name: "{{ eth_interface }}", primary: true }
        - { name: "{{ wifi_interface }}", primary: false }
      notify:
        - Reboot node

    # No DHCP client runs on the bond, so nothing maintains /etc/resolv.conf
    - name: Configure DNS
      ansible.builtin.template:
        src: network/resolv.conf.j2
        dest: /etc/resolv.conf
        owner: root
        group: root
        mode: '0644'
      when: dns_nameservers | default([]) | length > 0

    # Disable default networking
    - name: Remove ifupdown config
      ansible.builtin.file:
        path: /etc/network/interfaces
        state: absent

    - name: Mask ifupdown
      ansible.builtin.systemd_service:
        name: networking.service
        masked: true

    - name: Enable systemd-networkd
      ansible.builtin.systemd_service:
        name: systemd-networkd.service
        enabled: true

    - name: Apply pending changes before verification
      ansible.builtin.meta: flush_handlers

    # Waits only, never fails; the asserts below give the readable diagnostic
    - name: Wait for bond0 to converge
      ansible.builtin.slurp:
        src: /proc/net/bonding/bond0
      register: bond_state
      timeout: 30
      vars:
        _bond: "{{ bond_state.content | default('') | b64decode }}"
        _wifi: >-
          {{ (_bond.split('Slave Interface: ' ~ wifi_interface) | last).split('Slave Interface:') | first }}
      until:
        - "('Primary Slave: ' ~ eth_interface) in _bond"
        - "('Currently Active Slave: ' ~ eth_interface) in _bond"
        - "('Slave Interface: ' ~ wifi_interface) in _bond"
        - "'MII Status: up' in _wifi"
      retries: 6
      delay: 5
      failed_when: false

    - name: Decode bond0 state
      ansible.builtin.set_fact:
        bond_status: "{{ bond_state.content | default('') | b64decode }}"

    - name: Assert bond has correct primary and both slaves
      ansible.builtin.assert:
        that:
          - "('Primary Slave: ' ~ eth_interface) in bond_status"
          - "('Currently Active Slave: ' ~ eth_interface) in bond_status"
          - "('Slave Interface: ' ~ eth_interface) in bond_status"
          - "('Slave Interface: ' ~ wifi_interface) in bond_status"
        success_msg: "bond0 has {{ eth_interface }} as primary with both slaves attached"
        fail_msg: "bond0 misconfigured:\n{{ bond_status }}"

    - name: Assert the Wi-Fi slave is associated
      vars:
        wifi_block: >-
          {{ (bond_status.split('Slave Interface: ' ~ wifi_interface) | last).split('Slave Interface:') | first }}
      ansible.builtin.assert:
        that:
          - "'MII Status: up' in wifi_block"
        fail_msg: |
          {{ wifi_interface }} is enslaved but not associated, there is no redundancy:
          {{ wifi_block }}

    - name: Assert DNS resolves
      ansible.builtin.command: "getent hosts {{ dns_domain }}"
      changed_when: false

  handlers:
    - name: Reboot node
      ansible.builtin.reboot:
        reboot_timeout: 300
        connect_timeout: 10
        post_reboot_delay: 30
 