apiVersion: apps/v1
kind: Deployment
metadata:
  name: am-pulsar
spec:
  replicas: 1
  selector:
    matchLabels:
      app: am-pulsar
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: am-pulsar
    spec:
      containers:
        - image: ghcr.io/am-kenny/ampulsar:sha-85e2939
          name: am-pulsar
          envFrom:
            - configMapRef:
                name: am-pulsar-config
            - secretRef:
                name: am-pulsar-secrets
          volumeMounts:
            - name: data
              mountPath: /app/data
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: am-pulsar-data
