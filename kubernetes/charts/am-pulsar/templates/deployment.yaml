apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "am-pulsar.fullname" . }}
  labels:
    {{- include "am-pulsar.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "am-pulsar.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "am-pulsar.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "am-pulsar.serviceAccountName" . }}
      automountServiceAccountToken: false
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            - name: TWITCH_CHANNEL_NAME
              value: {{ required "twitch.channelName is required" .Values.twitch.channelName | quote }}
            - name: TELEGRAM_CHAT_ID
              value: {{ required "telegram.chatID is required" .Values.telegram.chatID | quote }}
            - name: TELEGRAM_EDIT_ON_CHANGE
              value: {{ .Values.telegram.editOnChange | quote }}
            - name: TELEGRAM_ACTION_ON_END
              value: {{ .Values.telegram.onEnd | quote }}
            - name: TELEGRAM_PIN
              value: {{ .Values.telegram.pin | quote }}
            - name: TEMPLATE_STYLE
              value: {{ .Values.template.style | quote }}
            - name: TEMPLATE_LANGUAGE
              value: {{ .Values.template.language | quote }}
            - name: POLL_INTERVAL
              value: {{ .Values.pollInterval | quote }}
            - name: STORE_PATH
              value: {{ printf "%s/store.json" (trimSuffix "/" .Values.persistence.mountPath) | quote }}
          envFrom:
            - secretRef:
                name: {{ .Values.existingSecret | default (printf "%s-secrets" (include "am-pulsar.fullname" .)) }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if .Values.persistence.enabled }}
          volumeMounts:
            - name: data
              mountPath: {{ .Values.persistence.mountPath }}
      {{- end }}
      {{- if .Values.persistence.enabled }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "am-pulsar.fullname" . }}-data
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
