image:
  repository: ghcr.io/gethomepage/homepage
  tag: v2.4.0

enableRbac: true
serviceAccount:
  create: true

env:
  - name: HOMEPAGE_ALLOWED_HOSTS
    value: homepage.amhome.app

envFrom:
  - secretRef:
      name: homepage-secrets

ingress:
  main:
    enabled: true
    ingressClassName: traefik
    hosts:
      - host: homepage.amhome.app
        paths:
          - path: /
            pathType: Prefix

nodeSelector:
  kubernetes.io/hostname: am-server

config:
  kubernetes:
    mode: cluster
  settings:
    title: AmHome
    theme: dark
  widgets:
    - kubernetes:
        cluster:
          show: true
          cpu: true
          memory: true
        nodes:
          show: true
          cpu: true
          memory: true
    - search:
        provider: duckduckgo
  services:
    - Infrastructure:
        - Pi-hole:
            href: https://pihole.amhome.app/admin
            icon: pi-hole.png
            widget:
              type: pihole
              version: 6
              url: http://pihole-web.pihole.svc.cluster.local
              key: "{{HOMEPAGE_VAR_PIHOLE_KEY}}"
        - Vault:
            href: https://vault.amhome.app
            icon: hashicorp-vault.png
    - Monitoring:
        - Prometheus:
            icon: prometheus.png
            widget:
              type: prometheus
              url: http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090
        - Grafana:
            href: https://grafana.amhome.app
            icon: grafana.png
            widget:
              type: grafana
              version: 2
              alerts: alertmanager
              url: http://kube-prometheus-stack-grafana.monitoring.svc.cluster.local
              username: "{{HOMEPAGE_VAR_GRAFANA_USER}}"
              password: "{{HOMEPAGE_VAR_GRAFANA_PASSWORD}}"
        - Alertmanager:
            href: https://alertmanager.amhome.app
            icon: alertmanager.png
        - Headlamp:
            href: https://headlamp.amhome.app
            icon: headlamp.png
    - Apps:
        - Overleaf:
            href: https://overleaf.amhome.app
            icon: overleaf.png
        - Obsidian Sync:
            href: https://notes.amhome.app/_utils
            icon: couchdb.png
  bookmarks: []
