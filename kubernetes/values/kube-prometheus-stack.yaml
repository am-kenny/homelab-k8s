# CRDs are managed with a separate release
crds:
  enabled: false

# k3s runs the scheduler, controller manager and kube-proxy inside the k3s
# process and this cluster stores state in SQLite.
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false
kubeEtcd:
  enabled: false

alertmanager:
  enabled: true
  ingress:
    enabled: true
    ingressClassName: traefik
    hosts:
      - alertmanager.amhome.app
  alertmanagerSpec:
    nodeSelector:
      kubernetes.io/hostname: am-server
    externalUrl: https://alertmanager.amhome.app
    secrets:
      - alertmanager-telegram
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: local-path
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 1Gi
  config:
    route:
      receiver: telegram
    receivers:
      # Null is used by Watchdog
      - name: "null"
      - name: telegram
        telegram_configs:
          - bot_token_file: /etc/alertmanager/secrets/alertmanager-telegram/bot-token
            chat_id_file: /etc/alertmanager/secrets/alertmanager-telegram/chat-id
            message: '{{ template "telegram.homelab.message" . }}'

prometheusOperator:
  nodeSelector:
    kubernetes.io/hostname: am-server

kube-state-metrics:
  nodeSelector:
    kubernetes.io/hostname: am-server
  metricLabelsAllowlist:
    - nodes=[amhome.app/ejectable]

prometheus:
  prometheusSpec:
    nodeSelector:
      kubernetes.io/hostname: am-server
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: local-path
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 10Gi

grafana:
  nodeSelector:
    kubernetes.io/hostname: am-server
  admin:
    existingSecret: grafana-admin
  ingress:
    enabled: true
    ingressClassName: traefik
    hosts:
      - grafana.amhome.app
  persistence:
    enabled: true
    storageClassName: local-path
    size: 1Gi

additionalPrometheusRulesMap:
  ejectable-nodes:
    groups:
      - name: ejectable-nodes
        rules:
          - record: node:ejectable_away
            expr: |
              (max by (node) (kube_node_labels{label_amhome_app_ejectable="true"}))
              unless on (node)
              (kube_node_status_condition{condition="Ready", status="true"} == 1)

          - alert: EjectableNodeAway
            expr: node:ejectable_away
            keep_firing_for: 15m
            labels:
              severity: none
            annotations:
              summary: Ejectable node {{ $labels.node }} is away.
