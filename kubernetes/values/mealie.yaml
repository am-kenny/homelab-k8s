# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/app-template-5.3.0/charts/other/app-template/values.schema.json
controllers:
  mealie:
    strategy: Recreate
    containers:
      app:
        image:
          repository: ghcr.io/mealie-recipes/mealie
          tag: v3.30.0
        env:
          BASE_URL: https://mealie.amhome.app
          TZ: Europe/Berlin
          ALLOW_SIGNUP: "false"

defaultPodOptions:
  nodeSelector:
    amhome.app/stable: "true"

service:
  app:
    controller: mealie
    ports:
      http:
        port: 9000

ingress:
  app:
    className: traefik
    hosts:
      - host: mealie.amhome.app
        paths:
          - path: /
            pathType: Prefix
            service:
              identifier: app
              port: http

persistence:
  data:
    type: persistentVolumeClaim
    accessMode: ReadWriteOnce
    size: 2Gi
    globalMounts:
      - path: /app/data
