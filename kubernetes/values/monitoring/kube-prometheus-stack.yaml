# CRDs are managed with a separate release
crds:
  enabled: false

# k3s runs the scheduler, controller manager and kube-proxy inside the k3s
# process and this cluster stores state in SQLite.
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false
kubeEtcd:
  enabled: false

alertmanager:
  enabled: true
  ingress:
    enabled: true
    ingressClassName: traefik
    hosts:
      - alertmanager.amhome.app
  alertmanagerSpec:
    nodeSelector:
      amhome.app/stable: "true"
    externalUrl: https://alertmanager.amhome.app
    secrets:
      - alertmanager-telegram
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: local-path
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 1Gi
  config:
    route:
      receiver: telegram
    receivers:
      # Null is used by Watchdog
      - name: "null"
      - name: telegram
        telegram_configs:
          - bot_token_file: /etc/alertmanager/secrets/alertmanager-telegram/bot-token
            chat_id_file: /etc/alertmanager/secrets/alertmanager-telegram/chat-id
            message: '{{ template "telegram.homelab.message" . }}'

prometheusOperator:
  nodeSelector:
    amhome.app/stable: "true"

kube-state-metrics:
  nodeSelector:
    amhome.app/stable: "true"

prometheus:
  prometheusSpec:
    nodeSelector:
      amhome.app/stable: "true"
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: local-path
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 10Gi

grafana:
  nodeSelector:
    amhome.app/stable: "true"
  admin:
    existingSecret: grafana-admin
  ingress:
    enabled: true
    ingressClassName: traefik
    hosts:
      - grafana.amhome.app
  persistence:
    enabled: true
    storageClassName: local-path
    size: 1Gi
