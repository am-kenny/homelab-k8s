image:
  # Built by Overleaf build workflow. Includes full TeX Live.
  repository: ghcr.io/am-kenny/homelab-k8s/overleaf

existingSecret: overleaf-secrets

overleaf:
  appName: "AmOverleaf"
  siteUrl: "https://overleaf.amhome.app"
  secureCookie: true

  emailConfirmationDisabled: true

  maxUploadSizeMb: 100
  historyRestore: true

  templateGallery:
    enabled: true

persistence:
  size: 20Gi

nodeSelector:
  amhome.app/ejectable: "true"

ingress:
  enabled: true
  className: traefik
  hosts:
    - host: overleaf.amhome.app
      paths:
        - path: /
          pathType: Prefix

mongodb:
  persistence:
    size: 8Gi
  nodeSelector:
    amhome.app/ejectable: "true"

redis:
  persistence:
    size: 2Gi
  nodeSelector:
    amhome.app/ejectable: "true"
